# /etc/modprobe.d/it87-noautoload.conf — canonical copy: 170hx_fan_control/it87-noautoload.conf
# Blocks udev/alias auto-loading at boot (in-tree or fork) until the §4.5 two-reboot
# check passes. Explicit `modprobe it87` still works. Remove this file to enable
# boot-time loading once trusted.
blacklist it87
